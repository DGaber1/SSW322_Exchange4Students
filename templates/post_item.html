{% extends "base.html" %}

{% block title %}Post Item{% endblock %}

{% block content %}
<h2>Post a New Item</h2>

<form method="POST">
  <div class="mb-3">
    <label>Title</label>
    <input type="text" name="title" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Description</label>
    <textarea name="description" class="form-control" required></textarea>
  </div>

  <div class="mb-3">
    <label>Price per Day</label>
    <input type="number" step="0.01" name="price_per_day" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Security Deposit</label>
    <input type="number" step="0.01" name="security_deposit" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Category</label>
    <input type="text" name="category" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Location</label>
    <input type="text" name="location" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Condition</label>
    <input type="text" name="condition" class="form-control" required>
  </div>

  <button type="submit" class="btn btn-primary">Post Item</button>
</form>

{% endblock %}
